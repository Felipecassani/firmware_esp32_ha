; Firmware experimental ESP32 - Cascata UC01786 + Home Assistant
; Este NÃO é o entregável da escola (esse mantém-se em Arduino Uno/Mega
; puro, sem rede, em ../cascata_UC01786 e ../projeto cascata).
; Este projeto liga a cascata real ao Home Assistant via WiFi + MQTT.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
build_flags =
    -D CORE_DEBUG_LEVEL=0
